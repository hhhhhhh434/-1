<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>任务大厅</title>
<meta name="theme-color" content="#15195c">
<style>
:root{--bg:#eef1f5;--card:#fff;--fg:#17212b;--mut:#5e6b7a;--line:#d6dde6;--pri:#2b53d6;--priT:#fff;--gold:#b97f00;--good:#16875a;--goodBg:#e1f5ec;--warn:#b4411f;--chip:#e6ebf4;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161e;--card:#19222d;--fg:#e8eef5;--mut:#9aa8b8;--line:#2c394a;--pri:#7b9bff;--priT:#0b1330;--gold:#e0ab3a;--good:#4fd09b;--goodBg:#16362b;--warn:#ff9a78;--chip:#243142;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161e;--card:#19222d;--fg:#e8eef5;--mut:#9aa8b8;--line:#2c394a;--pri:#7b9bff;--priT:#0b1330;--gold:#e0ab3a;--good:#4fd09b;--goodBg:#16362b;--warn:#ff9a78;--chip:#243142;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:.04em}
.sub{margin:2px 0 0;color:var(--mut);font-size:13px}
.me{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mut)}
.me b{font-size:18px;color:var(--gold);margin:0 4px}
nav{display:flex;gap:6px;margin:14px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--fg);font-weight:700;border-color:var(--pri)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.ch{border-left-color:var(--good)}
.card h3{margin:0;font-size:16px;line-height:1.4}
.desc{margin:0;color:var(--mut);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.card.open .desc{-webkit-line-clamp:unset}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--mut)}
.tag.ch{background:var(--goodBg);color:var(--good);font-weight:700}
.tag.st{background:var(--pri);color:var(--priT)}
.rw{font-size:20px;font-weight:700;color:var(--gold)}.card.ch .rw{color:var(--good)}
.meta{font-size:12.5px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.btn{font:inherit;font-size:13px;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btn.pri{background:var(--pri);color:var(--priT);border-color:var(--pri);font-weight:700}
.btn.link{border:0;background:none;color:var(--mut);text-decoration:underline;padding:6px 4px}
.star{font:inherit;font-size:12px;border:1px solid var(--gold);color:var(--gold);background:none;border-radius:6px;padding:3px 7px;cursor:pointer}
.warn{color:var(--warn);font-size:12.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:17px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
.form .full{grid-column:1/-1}
.score{font-size:46px;font-weight:700;color:var(--gold);line-height:1}
.prog{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.stats div{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--mut)}.stats b{display:block;font-size:20px;color:var(--fg)}
.led{list-style:none;margin:0;padding:0;font-size:13.5px}.led li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.pos{color:var(--good);font-weight:700}.neg{color:var(--warn);font-weight:700}
.cert{border:2px double var(--good);border-radius:12px;padding:16px;text-align:center;background:var(--goodBg);color:var(--good)}
.cert b{font-size:20px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rank{margin:0;padding-left:20px;font-size:14px}.rank li{padding:3px 0}.rank .m{font-weight:700;color:var(--pri)}
.empty{color:var(--mut);padding:24px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
footer{margin-top:22px;color:var(--mut);font-size:12.5px;text-align:center}
body{background:#d9dee6}
.wrap{position:relative;max-width:480px;min-height:100vh;background:var(--bg);padding:0 12px 96px;box-shadow:0 0 30px rgba(0,0,0,.12)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;justify-content:flex-start;align-items:center;gap:10px;flex-wrap:nowrap}
.logo{width:38px;height:38px;flex:none}
header h1{font-size:20px}
header .sub{margin:0;font-size:12px}
.me{flex:none;font-size:12px;padding:4px 8px}.me b{font-size:16px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);border-bottom:0;margin:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;overflow:visible}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:2px 0;border:0}
nav button .ic{font-size:21px;line-height:1.2}
nav button.on{border:0;color:var(--pri);font-weight:700}
nav button:nth-child(3) .ic{background:var(--pri);color:var(--priT);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;margin-top:-16px;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#more{position:absolute;right:12px;top:56px;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:20;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#more button{font:inherit;background:none;border:0;padding:10px 18px;text-align:left;color:var(--fg);cursor:pointer}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(170deg,#15195c,#2a3a9e 55%,#0e8a8f);color:#fff;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash b{font-size:30px;letter-spacing:.2em}#splash span{opacity:.85}
.card.sos{border-left-color:#d9381e}.card.sos h3::before{content:"🚨 "}
details summary{cursor:pointer;color:var(--pri);margin:6px 0}
#det{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-end}
#det.hide{display:none}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(26px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:12px 0 4px;font-size:15px}
#toast{z-index:60}
</style>
</head>

function stats(){

function openTaskChat(t){

function csend(id){
  var c=S.chats[id],x=v('cin');if(!c||!x)return;
  if(BAD.test(x)){toast('消息含违规词（如垫付、私下转账），请勿私下交易');return;}
  c.msgs.push({u:'我',txt:x.slice(0,200),ts:Date.now()});save();render();
  var o=c.members.filter(function(m){return m!=='我';});
  if(o.length)setTimeout(function(){c.msgs.push({u:o[rn(0,o.length-1)],txt:CHAT_REPLY[rn(0,4)],ts:Date.now()});save();render();},900);
}
function chText(c){return c.title+'\n'+c.msgs.map(function(m){return new Date(m.ts).toLocaleString()+' '+m.u+'：'+m.txt;}).join('\n');}
function chAct(act,id,a){
  var c=S.chats[id];if(!c)return;
  if(act==='copych'){var tx=chText(c);if(typeof navigator!=='undefined'&&navigator.clipboard){var pr=navigator.clipboard.writeText(tx);if(pr&&pr.catch)pr.catch(function(){});}toast('聊天记录已复制');return;}
  if(act==='savech'){S.saved.unshift({id:'sv'+Date.now(),title:c.title,txt:chText(c),ts:Date.now()});save();render();toast('已保存快照，可在“聊天与好友”里查看');return;}
  if(act==='clearch'){if(c.lock){toast('与发单人的聊天记录不能删除');return;}if(confirm('清空这段好友聊天记录？')){c.msgs=[{u:'系统',txt:'记录已清空',ts:Date.now()}];}save();render();return;}
  if(act==='cinvite'){var n=a.getAttribute('data-u');if(c.members.indexOf(n)<0){c.members.push(n);c.type='group';c.msgs.push({u:'系统',txt:n+' 加入了群聊',ts:Date.now()});}save();render();toast('已拉入群聊');}
}
function addFriend(n){
  n=(n||'').trim();if(!n||n==='我'){toast('请输入对方昵称');return;}
  if(S.friends.some(function(f){return f.n===n;})){toast(n+' 已经是你的好友');return;}
  S.friends.push({n:n,ts:Date.now()});save();render();toast('已向 '+n+' 发出申请（演示：对方已通过）');
}
function frAct(act,n){
  var i=S.freq.map(function(f){return f.n;}).indexOf(n);if(i<0)return;
  if(act==='facc'&&!S.friends.some(function(f){return f.n===n;}))S.friends.push({n:n,ts:Date.now()});
  S.freq.splice(i,1);save();render();toast(act==='facc'?'已通过好友申请':'已忽略');
}

function done(t,r){
  t.rating=r;t.status='done';if(r>=4&&!t.review)t.review=r===5?'合作非常愉快，交付超出预期，强烈推荐。':'整体满意，沟通顺畅，按时完成。';var ch=t.kind==='charity',m=rtOf(t)==='money';
  if(t.taker==='我'){
    var d=8+2*r,msg='';
    if(m&&t.reward<20){d=1;msg='（金额过低，只记 1 分）';}
    var same=S.tasks.filter(function(x){return x.taker==='我'&&x.status==='done'&&x.poster===t.poster;}).length;
    if(same>3){d=Math.ceil(d/2);msg+='（重复合作，减半）';}
    d=Math.max(0,Math.min(d,30-todayGain()));
    if(d<=0)msg='（今日信用增长已达 30 分上限，防刷分）';
    if(d>0)S.ledger.unshift({d:d,r:'完成「'+t.t+'」，获评 '+r+' 星'+msg,ts:Date.now(),k:'task'});
    if(ch&&t.reward)S.gy.unshift({d:t.reward,r:'公益任务「'+t.t+'」',ts:Date.now()});
    toast('验收通过，信用 +'+d+(ch&&t.reward?'，公益积分 +'+t.reward:'')+msg);
  }else if(t.poster==='我'){add(4,'验收并评价「'+t.t+'」');toast('已验收，信用 +4');}
}

    else if(act==='close'){ui.det=null;render();return;}
    else if(act==='hmore'){ui.hl=(ui.hl||6)+6;render();return;}

  var t=v('pt'),ds=v('pds'),r=parseInt(v('pr'),10),d=parseInt(v('pd'),10);
  if(!t){toast('请填写任务标题');return;}
  if(ds.length<10){toast('任务描述至少写 10 个字，写清楚验收标准');return;}
  if(!(r>=0)||!(d>=1)){toast('报酬和天数要填有效数字');return;}
  if(banned()){toast('你的账号已被限制发布，详见规则与安全');return;}
  if(BAD.test(t+ds)){warn('我','发布含违规词的任务');return;}
  if(S.tasks.some(function(x){return x.poster==='我'&&x.t===t&&x.status==='open';})){toast('你已经发布过相同的任务，请勿重复发布');return;}
  if(Date.now()-(S.lastPost||0)<8000){toast('发布太频繁，请稍后再试');return;}
  var rtv=v('prt'),cat=v('pc');
  if(rtv==='money'&&REF[cat]){var ref=REF[cat]*d;if(r<ref*0.3){toast('报酬过低：该类任务参考价约 ¥'+ref+'，低于 30% 不能发布');return;}if(r>ref*4&&!confirm('报酬远高于参考价（约 ¥'+ref+'）。高价诱导是常见骗局特征，确定继续吗？'))return;}
  if(rtv==='money'&&r>=1000&&parseInt(v('pn'),10)<80){toast('金额较大，接单者最低信用至少设为 80');return;}
  if(cat==='江湖救急'){if(credit()<100){toast('发布“江湖救急”需要你的信用 ≥ 100');return;}if(parseInt(v('pn'),10)<300){toast('江湖救急任务，接单者信用至少 300');return;}}
  if(v('psk')==='__other'){var cs=v('psk2');if(cs.length<2){toast('请输入你的职业或技能名称（至少 2 个字）');return;}if(BAD.test(cs)){toast('名称含违规词，请修改');return;}}
  S.lastPost=Date.now();
  var sl=parseInt(v('psl'),10)||0;
  S.tasks.unshift({id:'m'+Date.now(),t:t,cat:v('pc'),kind:v('pk'),skill:(v('psk')==='__other'?v('psk2'):v('psk')),req:v('prq'),rules:v('pru'),notes:v('pnt'),rt:v('prt'),rtext:v('prx'),scope:v('psc'),slots:sl>=2?sl:0,joined:0,dep:parseInt(v('pdp'),10)||0,reward:r,days:d,mode:v('pm'),loc:v('pl'),min:parseInt(v('pn'),10),poster:'我',pc:credit(),desc:ds,status:'open',taker:null,rating:0,ts:Date.now()});
  save();ui.tab='mine';render();toast('发布成功');
}
render();
setTimeout(function(){document.getElementById('splash').classList.add('off');},1300);
document.getElementById('splash').addEventListener('click',function(){this.classList.add('off');});
})();
</script>
